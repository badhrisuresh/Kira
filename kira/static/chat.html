<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Kira — WhatsApp Simulator</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: #0b141a;
  color: #e9edef;
  height: 100dvh;
  display: flex;
  flex-direction: column;
}

header {
  background: #1f2c34;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid #2a3942;
}

header .avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: #00a884;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 18px;
  color: #fff;
}

header .info h1 {
  font-size: 16px;
  font-weight: 500;
  color: #e9edef;
}

header .info span {
  font-size: 12px;
  color: #8696a0;
}

header .actions {
  margin-left: auto;
  display: flex;
  gap: 8px;
}

header .actions button {
  background: none;
  border: 1px solid #2a3942;
  color: #8696a0;
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
}
header .actions button:hover {
  background: #2a3942;
  color: #e9edef;
}

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px 60px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  background: #0b141a url("data:image/svg+xml,%3Csvg width='400' height='400' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3Cpattern id='p' width='40' height='40' patternUnits='userSpaceOnUse'%3E%3Cpath d='M20 0v40M0 20h40' stroke='%23ffffff' stroke-width='0.3' opacity='0.03'/%3E%3C/pattern%3E%3C/defs%3E%3Crect fill='url(%23p)' width='400' height='400'/%3E%3C/svg%3E");
}

.msg {
  max-width: 65%;
  padding: 6px 10px 8px;
  border-radius: 8px;
  font-size: 14.2px;
  line-height: 1.4;
  white-space: pre-wrap;
  word-wrap: break-word;
  position: relative;
  margin-bottom: 2px;
}

.msg .time {
  font-size: 11px;
  color: rgba(255,255,255,0.45);
  float: right;
  margin-left: 8px;
  margin-top: 4px;
}

.msg.user {
  align-self: flex-end;
  background: #005c4b;
  border-top-right-radius: 0;
}

.msg.kira {
  align-self: flex-start;
  background: #1f2c34;
  border-top-left-radius: 0;
}

.msg.kira.push {
  border-left: 3px solid #00a884;
}

.msg.system {
  align-self: center;
  background: #182229;
  color: #8696a0;
  font-size: 12px;
  padding: 4px 12px;
  border-radius: 6px;
  max-width: 80%;
}

.typing-indicator {
  align-self: flex-start;
  background: #1f2c34;
  border-radius: 8px;
  border-top-left-radius: 0;
  padding: 10px 14px;
  display: flex;
  gap: 4px;
}

.typing-indicator span {
  width: 7px;
  height: 7px;
  background: #8696a0;
  border-radius: 50%;
  animation: bounce 1.4s infinite ease-in-out both;
}
.typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
.typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

@keyframes bounce {
  0%, 80%, 100% { transform: scale(0); }
  40% { transform: scale(1); }
}

#input-bar {
  display: flex;
  gap: 8px;
  padding: 8px 12px;
  background: #1f2c34;
  border-top: 1px solid #2a3942;
  align-items: center;
}

#input-bar input {
  flex: 1;
  padding: 10px 14px;
  border-radius: 8px;
  border: none;
  background: #2a3942;
  color: #e9edef;
  font-size: 15px;
  outline: none;
}

#input-bar input::placeholder {
  color: #8696a0;
}

#input-bar button {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: none;
  background: #00a884;
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

#input-bar button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
</style>
</head>
<body>

<header>
  <div class="avatar">K</div>
  <div class="info">
    <h1>Kira</h1>
    <span id="status-text">WhatsApp Simulator</span>
  </div>
  <div class="actions">
    <button onclick="resetSession()">New Session</button>
  </div>
</header>

<div id="messages"></div>

<div id="input-bar">
  <input type="text" id="msg-input" placeholder="Type a message" autocomplete="off" />
  <button id="send-btn" onclick="send()">&#9654;</button>
</div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('msg-input');
const sendBtn = document.getElementById('send-btn');
const statusEl = document.getElementById('status-text');

let polling = false;
let pollTimer = null;

inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !sendBtn.disabled) send();
});

function timeStr() {
  return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function addMsg(text, role, extra) {
  const div = document.createElement('div');
  div.className = `msg ${role}` + (extra ? ` ${extra}` : '');
  if (role === 'system') {
    div.textContent = text;
  } else {
    div.innerHTML = escapeHtml(text) + `<span class="time">${timeStr()}</span>`;
  }
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function escapeHtml(t) {
  const d = document.createElement('div');
  d.textContent = t;
  return d.innerHTML;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'typing-indicator';
  div.id = 'typing';
  div.innerHTML = '<span></span><span></span><span></span>';
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById('typing');
  if (el) el.remove();
}

async function send() {
  const text = inputEl.value.trim();
  if (!text) return;

  addMsg(text, 'user');
  inputEl.value = '';
  sendBtn.disabled = true;
  showTyping();

  try {
    const res = await fetch('/api/wa-sim/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text }),
    });
    const data = await res.json();
    hideTyping();

    if (data.reply) {
      addMsg(data.reply, 'kira');
    }

    startPolling();
  } catch (err) {
    hideTyping();
    addMsg(`Network error: ${err.message}`, 'system');
  }

  sendBtn.disabled = false;
}

function startPolling() {
  if (polling) return;
  polling = true;
  statusEl.textContent = 'WhatsApp Simulator — listening for push messages...';
  pollTimer = setInterval(pollPush, 2000);
}

function stopPolling() {
  polling = false;
  statusEl.textContent = 'WhatsApp Simulator';
  if (pollTimer) {
    clearInterval(pollTimer);
    pollTimer = null;
  }
}

let idleCount = 0;
async function pollPush() {
  try {
    const res = await fetch('/api/wa-sim/push');
    const data = await res.json();
    if (data.messages && data.messages.length > 0) {
      idleCount = 0;
      for (const msg of data.messages) {
        addMsg(msg, 'kira', 'push');
      }
    } else {
      idleCount++;
      if (idleCount > 150) {
        stopPolling();
        idleCount = 0;
      }
    }
  } catch (e) {}
}

async function resetSession() {
  stopPolling();
  try {
    await fetch('/api/wa-sim/reset', { method: 'POST' });
  } catch (e) {}
  messagesEl.innerHTML = '';
  addMsg('Session reset — next message starts a fresh conversation', 'system');
  idleCount = 0;
}

addMsg('WhatsApp simulator ready. Messages go through the same Twilio/WhatsApp code path — you will see the exact same experience as a WhatsApp user, including summarization, progress updates, and push messages.', 'system');
</script>

</body>
</html>
